name: Daily Solace Anchor

on:
  schedule:
    # 12:34 UTC daily. Off the hour to avoid GitHub schedule herds.
    - cron: '34 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out anchor repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate today's anchor
        env:
          SOLACE_API_URL: https://solace.fyi
        run: node scripts/generate-anchor.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          if git diff --cached --quiet; then
            echo "No anchor changes to commit."
          else
            git commit -m "Anchor chain head for $(date -u +%Y-%m-%d)"
            git push
          fi
