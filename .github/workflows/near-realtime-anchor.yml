name: Near-real-time Solace Anchor

on:
  schedule:
    # Every 5 minutes. GitHub schedule resolution is ~1 minute; this keeps the
    # public anchor within moments of a new sealed decision.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out anchor repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate latest anchor
        env:
          SOLACE_API_URL: https://solace.fyi
        run: node scripts/generate-anchor.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          if git diff --cached --quiet; then
            echo "No anchor changes to commit."
          else
            git commit -m "Anchor chain head at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
